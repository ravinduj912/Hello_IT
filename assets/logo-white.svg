<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradients for 3D 'H' and Accents -->
    <linearGradient id="hLeftGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hRightGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="hFrontHighlightW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="itVibrantGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="swooshGradW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="pixelGrad1W" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="pixelGrad2W" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pixelGrad3W" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="lineGradLeftW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lineGradRightW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Glow -->
    <filter id="swooshGlowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ==================== ICON MARK (H + Pixels + Swoosh) ==================== -->
  <g id="logoIconGroupW" transform="translate(10, 8)">
    
    <!-- Pixel Cubes Array -->
    <rect x="36" y="38" width="13" height="13" rx="2" fill="url(#pixelGrad1W)" transform="skewX(-14)"/>
    <rect x="53" y="35" width="14" height="14" rx="2" fill="url(#pixelGrad2W)" transform="skewX(-14)"/>
    <rect x="71" y="31" width="16" height="16" rx="2.5" fill="url(#pixelGrad3W)" transform="skewX(-14)"/>
    <rect x="91" y="27" width="22" height="22" rx="3" fill="url(#itVibrantGradW)" transform="skewX(-14)"/>

    <rect x="44" y="54" width="15" height="15" rx="2" fill="url(#pixelGrad1W)" transform="skewX(-14)"/>
    <rect x="63" y="52" width="17" height="17" rx="2.5" fill="url(#pixelGrad2W)" transform="skewX(-14)"/>
    <rect x="84" y="51" width="30" height="30" rx="3.5" fill="url(#itVibrantGradW)" transform="skewX(-14)"/>

    <rect x="58" y="73" width="16" height="16" rx="2.5" fill="url(#pixelGrad2W)" transform="skewX(-14)"/>
    <rect x="78" y="74" width="24" height="24" rx="3" fill="url(#pixelGrad3W)" transform="skewX(-14)"/>

    <!-- Right Leg of H -->
    <path d="M165 36 L198 36 L164 164 L131 164 Z" fill="#0F172A"/>
    <path d="M168 36 L195 36 L161 164 L134 164 Z" fill="url(#hRightGradW)"/>

    <!-- Horizontal Connecting Crossbar -->
    <path d="M96 90 L166 90 L156 122 L86 122 Z" fill="#0F172A"/>
    <path d="M98 92 L163 92 L154 120 L89 120 Z" fill="url(#hFrontHighlightW)"/>

    <!-- Left Leg of H -->
    <path d="M92 56 L128 56 L94 164 L58 164 Z" fill="#0F172A"/>
    <path d="M95 56 L124 56 L90 164 L61 164 Z" fill="url(#hLeftGradW)"/>
    <path d="M95 56 L108 56 L74 164 L61 164 Z" fill="url(#hFrontHighlightW)"/>

    <!-- Bottom Left 3D Base Cap of H -->
    <polygon points="61,164 90,164 80,172 51,172" fill="#38BDF8" opacity="0.9"/>
    <polygon points="134,164 161,164 153,172 126,172" fill="#60A5FA" opacity="0.9"/>

    <!-- Orbital Curved Swoosh Ring -->
    <path d="M 24 136 C 18 155, 34 172, 68 168 C 105 163, 150 134, 218 68 C 172 108, 114 142, 68 144 C 42 145, 29 138, 24 136 Z" 
          fill="url(#swooshGradW)" filter="url(#swooshGlowW)"/>
    <path d="M 28 139 C 38 158, 75 158, 126 138 C 174 118, 204 88, 218 68 C 200 88, 162 120, 118 135 C 72 150, 40 148, 28 139 Z" 
          fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- ==================== TYPOGRAPHY (WHITE / LIGHT) ==================== -->
  <!-- Top Wordmark: HELLO (White) + IT (Cyan Blue Gradient) -->
  <g id="brandTitleGroupW" transform="translate(230, 96)">
    <text x="0" y="0" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="-1.5px" 
          fill="#FFFFFF">HELLO</text>
    <text x="245" y="0" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="-1.5px" 
          fill="url(#itVibrantGradW)">IT</text>
  </g>

  <!-- Middle Subtitle: SOLUTIONS -->
  <g id="brandSubtitleGroupW" transform="translate(232, 140)">
    <text x="0" y="0" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="33" 
          font-weight="800" 
          letter-spacing="9px" 
          fill="#F1F5F9">SOLUTIONS</text>
  </g>

  <!-- Bottom Line & Tagline: TECHNOLOGY MADE SIMPLE. -->
  <g id="brandTaglineGroupW" transform="translate(200, 172)">
    <path d="M 0 0 L 55 0" stroke="url(#lineGradLeftW)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="65" y="4" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="4px" 
          fill="#38BDF8">TECHNOLOGY MADE SIMPLE.</text>
    <path d="M 388 0 L 445 0" stroke="url(#lineGradRightW)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
